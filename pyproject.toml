
[project]
name = "k8stools"
version = "2.0.2"
description = "Tools and an MCP server for building Kubernetes agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jeff Fischer" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "kubernetes>=36.0.3",
    "mcp>=2.1.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=14.0.0",
]

urls = { "Homepage" = "https://github.com/BenedatLLC/k8stools" }

[project.scripts]
k8s-mcp-server = "k8stools.mcp_server:main"
k8s-mcp-client = "k8stools.mcp_client:main"
k8s-capture-state = "k8stools.capture:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8stools"]
